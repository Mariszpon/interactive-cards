<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card</title>
    <!-- Link pro CSS -->
    <link rel="stylesheet" href="style.css">
       <!-- Link para as fontes do Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Elsie:wght@400;900&display=swap" rel="stylesheet">
    <!-- Imagem de fundo-->
    <style>
        body{
            background-image: url(fundo.jpg);
            background-repeat: repeat
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="card card1">
            <img src="lego1.png" alt="Imagem">
            <h1>The Insect Collection</h1>
            <div class="notas">
            ★★★★★
            </div>
            <div class="tags">
                <span class="tag">Exclusivo</span>
                <span class="tag">Saindo de linha</span>
            </div>
            <p>blablabla</p>
            <a href="https://www.lego.com/en-us/product/the-insect-collection-21342">
            <button class="btn">Compre aqui!</button>
            </a>
        </div>
        <div class="card card2">
            <img src="lego2.png" alt="Imagem">
            <h1>Floating Sea Otters</h1> 
            <div class="notas">
            ★★★★★
            </div>
            <p>blablabla</p>
            <a href="https://www.lego.com/en-us/product/floating-sea-otters-21366">
            <button class="btn">Compre aqui!</button>
            </a>
        </div>
        <div class="card card3">
            <img src="lego3.png" alt="Imagem">
            <h1>Hanging Golden Pothos</h1>
            <div class="notas">
            ★★★★★
            </div>
            <div class="tags">
                <span class="tag">Novo</span>
            </div>
            <p>blablabla</p>
            <a href="https://www.lego.com/en-us/product/hanging-golden-pothos-11512">
            <button class="btn">Compre aqui!</button>
            </a>
        </div>
    </div>
</body>
</html>
<!--O <a href="url">Opcional</a> serve para definir um link. Eu deixei dentro do botão para que, quando clicado, fosse para o link. -->
